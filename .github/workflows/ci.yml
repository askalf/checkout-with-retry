name: ci

# Smoke-tests the action against this repo itself: a real checkout through the
# retry wrapper, into a subdirectory, then assert the tree actually landed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      # bootstrap checkout so `uses: ./` can resolve the local action
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout via the retry wrapper
        uses: ./
        with:
          path: smoke

      - name: Assert the checkout landed
        run: |
          set -euo pipefail
          test -f smoke/action.yml
          echo "self-checkout through the wrapper OK"

      # Regression case for the sparse-checkout-cone-mode input: it was
      # silently DROPPED (unknown-input-no-error) before this input existed,
      # so every caller doing a single-FILE sparse checkout got cone mode
      # regardless and failed with "is not a directory" on every run
      # (dario's cc-oauth-health.yml, months of hourly failures). Cone mode
      # requires directory patterns; this asserts the false path actually
      # reaches actions/checkout and a bare file pattern works.
      - name: Checkout a single file (sparse, non-cone)
        uses: ./
        with:
          path: smoke-sparse
          sparse-checkout: action.yml
          sparse-checkout-cone-mode: 'false'

      - name: Assert the single-file sparse checkout landed
        run: |
          set -euo pipefail
          test -f smoke-sparse/action.yml
          echo "single-file sparse checkout (cone-mode: false) OK"
